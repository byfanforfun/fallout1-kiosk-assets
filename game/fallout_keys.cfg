; fallout_keys.cfg
; Раскладки клавиш по окнам для геймпада (kiosk).
;
; Формат: [секция] и строки <физический код>=<логический код>, где коды - из kb.h.
; Слева - код, который приходит от клавиатуры/геймпада (gamepad.cfg),
; справа - код, который ожидает окно. Если пары нет - код проходит как есть.
; Всё после ';' - комментарий.
;
; Предполагается дефолтный gamepad.cfg (см. src/plib/gnw/gamepad.cc):
;   dpad_up=i(105)  dpad_down=TAB(9)  dpad_left=c(99)  dpad_right=p(112)
;   A=RETURN(13)  B=SPACE(32)  X=s(115)  Y=ESC(27)
;   L1=n(110)  R1=a(97)  L2=b(98)  R2=m(109)  L3=HOME(327)
;   Start=F6(320)  Back=F7(321)  Guide=F12(390)
;   Левый стик = стрелки 328/336/331/333, правый стик = мышь.
;
; Числовые коды окон (500+) см. FALLOUT_WINDOWS_KEYS.md: их можно указывать
; как логический код, и окно обработает нажатие как кнопку.

[main]
; I заставка, N новая, L загрузка, C титры, E выход
105=105
99=99
9=110
112=108
115=101
13=110
32=110

